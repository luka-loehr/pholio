<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" font-family="Inter, system-ui, sans-serif">
  <!-- One image for both color schemes: the page's color-scheme reaches the image, so the
       media query below follows Pholio's light and dark toggle. -->
  <style>
    .bg { fill: #fafafa; }
    .box { stroke: #e5e5e5; fill: #ffffff; }
    .line { stroke: #a3a3a3; }
    .head { fill: #a3a3a3; }
    .title { fill: #171717; }
    .sub { fill: #737373; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #121212; }
      .box { stroke: #2e2e2e; fill: #1a1a1a; }
      .line { stroke: #737373; }
      .head { fill: #737373; }
      .title { fill: #ededed; }
      .sub { fill: #a3a3a3; }
    }
  </style>
  <rect class="bg" width="720" height="200"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>
  <g class="box" stroke-width="1.5">
    <rect x="40" y="60" width="160" height="80" rx="12"/>
    <rect x="280" y="60" width="160" height="80" rx="12"/>
    <rect x="520" y="60" width="160" height="80" rx="12"/>
  </g>
  <g class="line" stroke-width="2" marker-end="url(#a)">
    <path d="M208 100h62"/>
    <path d="M448 100h62"/>
  </g>
  <g class="title" text-anchor="middle" font-size="17" font-weight="600">
    <text x="120" y="98">Markdown</text>
    <text x="360" y="98">pholio build</text>
    <text x="600" y="98">Static site</text>
  </g>
  <g class="sub" text-anchor="middle" font-size="13">
    <text x="120" y="120">content/*.md</text>
    <text x="360" y="120">PHP, once</text>
    <text x="600" y="120">HTML, CSS, JS</text>
  </g>
</svg>
