name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ubuntu-26.04: PHP there links the system PCRE2 (10.43 or newer). ubuntu-24.04 ships 10.42, on which the
# highlighter cannot translate some grammar lookbehinds.
jobs:
  php:
    name: PHP ${{ matrix.php }} – lint, tests, demo check
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, ctype
          coverage: none
          tools: none

      - name: Require PCRE2 10.43 or newer
        run: |
          php -v
          php -r 'echo "PCRE2 ", PCRE_VERSION, PHP_EOL;'
          php -r 'exit(version_compare(explode(" ", PCRE_VERSION)[0], "10.43", ">=") ? 0 : 1);' \
            || { echo "::error::PCRE2 $(php -r 'echo PCRE_VERSION;') is older than 10.43, which the highlighter needs"; exit 1; }

      - name: Lint
        run: ./scripts/lint.sh

      - name: Tests
        run: php tests/run.php

      - name: Check (lint, tests, demo against snapshot)
        run: ./scripts/check.sh

  verify:
    name: Verify tier 2 – Node 26
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, ctype
          coverage: none
          tools: none

      - name: Set up Node 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: verify/package-lock.json

      - name: Install verify dependencies
        working-directory: verify
        run: npm ci

      # The DOM, style and pixel selftests launch Chromium. The cache key follows the pinned Playwright version.
      - name: Read the Playwright version
        id: playwright
        working-directory: verify
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell

      - name: Install Chromium headless shell
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: verify
        run: npx playwright install --with-deps chromium-headless-shell

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: verify
        run: npx playwright install-deps chromium-headless-shell

      - name: Tier 2
        working-directory: verify
        run: node run.mjs --tier 2
