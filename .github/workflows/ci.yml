name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Every commit on main keeps its run, so a busy main
# still reports a result per commit.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

# The PHP matrix runs on the stable ubuntu-latest image, whose PHP links PCRE2 10.42: that is what users on
# stable distributions have, so the highlighter's pre-10.43 fallback is exercised there (and forced in
# tests/HighlightFallbackTest.php). The ubuntu-26.04 jobs (PCRE2 10.43 or newer) are the full-fidelity check:
# scripts/check.sh with the byte-exact highlight references and the demo snapshot.
jobs:
  php:
    name: PHP ${{ matrix.php }} – lint, tests, demo build (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, ctype
          coverage: none
          tools: none

      - name: Show PHP and PCRE2 versions
        run: |
          php -v
          php -r 'echo "PCRE2 ", PCRE_VERSION, PHP_EOL;'
          php -r 'exit(version_compare(explode(" ", PCRE_VERSION)[0], "10.43", ">=") ? 0 : 1);' \
            || echo "::warning::PCRE2 $(php -r 'echo PCRE_VERSION;') is older than 10.43: highlighting of a few languages is simplified"

      - name: Lint
        run: ./scripts/lint.sh

      # HighlightTest, PipelineTest and BuildTest compare output byte for byte with references made on PCRE2 10.43+.
      # They run in the full-fidelity job until they skip themselves on an older PCRE2.
      - name: Tests (without the byte-exact highlight and snapshot tests)
        run: |
          only="$(ls tests/*Test.php | sed 's#^tests/##; s#Test\.php$##' | grep -vxE 'Highlight|Pipeline|Build' | paste -sd, -)"
          php tests/run.php --only "$only"

      - name: Demo build with this PCRE2
        run: |
          out="$(mktemp -d)"
          php bin/pholio build --config examples/demo/pholio.config.php --out "$out" 2> build.err
          cat build.err
          if php -r 'exit(version_compare(explode(" ", PCRE_VERSION)[0], "10.43", "<") ? 0 : 1);'; then
            grep -q 'older than 10.43' build.err || { echo "::error::no PCRE2 fallback warning on $(php -r 'echo PCRE_VERSION;')"; exit 1; }
          fi

  highlight:
    name: PHP ${{ matrix.php }} – full fidelity, byte-exact highlight and snapshot (ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # Tests and check.sh skip their PCRE2 10.43+ comparisons on an older PCRE2; here a skip is a failure.
    env:
      PHOLIO_REQUIRE_PCRE2: '1'
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, ctype
          coverage: none
          tools: none

      - name: Require PCRE2 10.43 or newer
        run: |
          php -v
          php -r 'echo "PCRE2 ", PCRE_VERSION, PHP_EOL;'
          php -r 'exit(version_compare(explode(" ", PCRE_VERSION)[0], "10.43", ">=") ? 0 : 1);' \
            || { echo "::error::PCRE2 $(php -r 'echo PCRE_VERSION;') is older than 10.43, which the highlighter needs"; exit 1; }

      - name: Check (lint, tests, demo against snapshot)
        run: ./scripts/check.sh

  verify:
    name: Verify tier 2 – Node 26 (ubuntu-26.04)
    # Tier 2 runs scripts/check.sh, which compares the demo with its PCRE2 10.43+ snapshot.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, ctype
          coverage: none
          tools: none

      - name: Set up Node 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: verify/package-lock.json

      - name: Install verify dependencies
        working-directory: verify
        run: npm ci

      # The DOM, style and pixel selftests launch Chromium. The cache key follows the pinned Playwright version.
      - name: Read the Playwright version
        id: playwright
        working-directory: verify
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell

      - name: Install Chromium headless shell
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: verify
        run: npx playwright install --with-deps chromium-headless-shell

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: verify
        run: npx playwright install-deps chromium-headless-shell

      - name: Tier 2
        working-directory: verify
        run: node run.mjs --tier 2
