name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }} – lint, tests, demo check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, ctype
          coverage: none
          tools: none

      - name: Show PHP and PCRE2 versions
        run: |
          php -v
          php -r 'echo "PCRE2 ", PCRE_VERSION, PHP_EOL;'

      - name: Lint
        run: ./scripts/lint.sh

      - name: Tests
        run: php tests/run.php

      - name: Check (lint, tests, demo against snapshot)
        run: ./scripts/check.sh

  verify:
    name: Verify tier 2 – Node 26
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, ctype
          coverage: none
          tools: none

      - name: Set up Node 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: verify/package-lock.json

      - name: Install verify dependencies
        working-directory: verify
        run: npm ci

      - name: Tier 2
        working-directory: verify
        run: node run.mjs --tier 2
