name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The PHP matrix runs on the stable ubuntu-latest image, whose PHP links PCRE2 10.42: that is what users on
# stable distributions have, so the highlighter's pre-10.43 fallback is exercised there (and forced in
# tests/HighlightFallbackTest.php). The ubuntu-26.04 jobs (PCRE2 10.43 or newer) are the full-fidelity check:
# scripts/check.sh with the byte-exact highlight references and the demo snapshot.
jobs:
  tag:
    name: Tag matches VERSION and CHANGELOG
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare tag with VERSION
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($file_version)"
            exit 1
          fi

      - name: Find the CHANGELOG section
        run: ./scripts/release.sh --notes "${GITHUB_REF_NAME#v}" > /dev/null

  test:
    name: PHP ${{ matrix.php }} – lint, tests, demo build (ubuntu-latest)
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, ctype
          coverage: none
          tools: none

      - name: Show PHP and PCRE2 versions
        run: |
          php -v
          php -r 'echo "PCRE2 ", PCRE_VERSION, PHP_EOL;'
          php -r 'exit(version_compare(explode(" ", PCRE_VERSION)[0], "10.43", ">=") ? 0 : 1);' \
            || echo "::warning::PCRE2 $(php -r 'echo PCRE_VERSION;') is older than 10.43: highlighting of a few languages is simplified"

      - name: Lint
        run: ./scripts/lint.sh

      # HighlightTest, PipelineTest and BuildTest compare output byte for byte with references made on PCRE2 10.43+.
      # They run in the full-fidelity job until they skip themselves on an older PCRE2.
      - name: Tests (without the byte-exact highlight and snapshot tests)
        run: |
          only="$(ls tests/*Test.php | sed 's#^tests/##; s#Test\.php$##' | grep -vxE 'Highlight|Pipeline|Build' | paste -sd, -)"
          php tests/run.php --only "$only"

      - name: Demo build with this PCRE2
        run: |
          out="$(mktemp -d)"
          php bin/pholio build --config examples/demo/pholio.config.php --out "$out" 2> build.err
          cat build.err
          if php -r 'exit(version_compare(explode(" ", PCRE_VERSION)[0], "10.43", "<") ? 0 : 1);'; then
            grep -q 'older than 10.43' build.err || { echo "::error::no PCRE2 fallback warning on $(php -r 'echo PCRE_VERSION;')"; exit 1; }
          fi

  highlight:
    name: PHP ${{ matrix.php }} – full fidelity, byte-exact highlight and snapshot (ubuntu-26.04)
    needs: tag
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, ctype
          coverage: none
          tools: none

      - name: Require PCRE2 10.43 or newer
        run: |
          php -v
          php -r 'echo "PCRE2 ", PCRE_VERSION, PHP_EOL;'
          php -r 'exit(version_compare(explode(" ", PCRE_VERSION)[0], "10.43", ">=") ? 0 : 1);' \
            || { echo "::error::PCRE2 $(php -r 'echo PCRE_VERSION;') is older than 10.43, which the highlighter needs"; exit 1; }

      - name: Check (lint, tests, demo against snapshot)
        run: ./scripts/check.sh

  release:
    name: Publish GitHub Release
    needs: [test, highlight]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build archives and SHA256SUMS
        run: ./scripts/release.sh --package "$GITHUB_REF_NAME" dist

      - name: Release notes from CHANGELOG.md
        run: ./scripts/release.sh --notes "${GITHUB_REF_NAME#v}" > notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=()
          case "$version" in
            *-*) prerelease=(--prerelease) ;;
          esac
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Pholio $version" --notes-file notes.md "${prerelease[@]}"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Pholio $version" \
              --notes-file notes.md "${prerelease[@]}"
          fi
